name: DevNetworkWatcher Bridge CI
on:
  push:
    branches: [main, "fix/studio-bridge-protocol-v1"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: studio-bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-linux:
    name: Python backend, TLS and schema v1/v2 contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run backend regression suite
        run: |
          python3 -m unittest discover -v -s Tests/BackendTests
          python3 -m py_compile Sources/PTNetworkStudio/Backend/*.py
          python3 Scripts/bench-diagnostics.py > diagnostics-baseline.json
          python3 Scripts/bench_studio_matrix.py > studio-pr42-matrix-linux.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-backend-diagnostics-linux
          path: |
            diagnostics-baseline.json
            studio-pr42-matrix-linux.json
          if-no-files-found: ignore
          retention-days: 14

  test-macos:
    name: macOS build + schema v1 tests
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Backend schema v1 and TLS tests
        run: |
          python3 -m unittest discover -v -s Tests/BackendTests
          python3 -m py_compile Sources/PTNetworkStudio/Backend/*.py
      - name: Diagnostic JSON processing baseline (non-gating)
        run: |
          python3 Scripts/bench-diagnostics.py > diagnostics-baseline.json
          python3 Scripts/bench_studio_matrix.py > studio-pr42-matrix-macos.json
          cat diagnostics-baseline.json
          cat studio-pr42-matrix-macos.json
      - uses: actions/upload-artifact@v4
        with:
          name: studio-diagnostics-benchmark
          path: |
            diagnostics-baseline.json
            studio-pr42-matrix-macos.json
          retention-days: 14
      - name: Native macOS SwiftPM build and tests
        run: |
          swift package dump-package >/dev/null
          swiftc -frontend -parse Sources/PTNetworkStudio/*.swift
          python3 Scripts/audit-swift-source.py
          swift test
          sh Scripts/build-macos.sh

  release-gates:
    name: PR41/45 all automated Studio gates
    if: always()
    needs: [backend-linux, test-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both Linux and Apple SDK checks
        env:
          REQUIRED_GATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          jobs = json.loads(os.environ["REQUIRED_GATE_RESULTS"])
          bad = sorted((name, job.get("result", "unknown"))
                       for name, job in jobs.items()
                       if job.get("result") != "success")
          for name, result in bad:
              print(f"FAIL: {name}: {result}")
          if bad:
              sys.exit(1)
          print("PASS: backend + native macOS build and test gates")
          PY
